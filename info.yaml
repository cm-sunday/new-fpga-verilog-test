# Tiny Tapeout project information
project:
  title:        "Elevator"      
  author:       "ChipMango"      # FIXED: Use a real name
  discord:      "your_discord_handle"  # FIXED: Add your actual Discord handle
  description:  "Elevator state machine example with 7-segment display"      
  language:     "Verilog"
  clock_hz:     10000000       # FIXED: 10 MHz is more realistic for hardware

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_chipmango_elevator"

  # List your project's source files here.
  # Source files must be in ./src
  source_files:
    - "elevator.v"  # FIXED: This must match the actual filename in src/

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs - FIXED: More descriptive pin names
  ui[0]: "floor request bit 0"
  ui[1]: "floor request bit 1"
  ui[2]: "floor request bit 2"
  ui[3]: "floor request bit 3"
  ui[4]: "unused"
  ui[5]: "unused"
  ui[6]: "unused"
  ui[7]: "unused"

  # Outputs
  uo[0]: "7-seg segment a"
  uo[1]: "7-seg segment b"
  uo[2]: "7-seg segment c"
  uo[3]: "7-seg segment d"
  uo[4]: "7-seg segment e"
  uo[5]: "7-seg segment f"
  uo[6]: "7-seg segment g"
  uo[7]: "idle indicator"

  # Bidirectional pins
  uio[0]: "not connected"
  uio[1]: "not connected"
  uio[2]: "not connected"
  uio[3]: "not connected"
  uio[4]: "not connected"
  uio[5]: "not connected"
  uio[6]: "not connected"
  uio[7]: "not connected"

# Do not change!
yaml_version: 6