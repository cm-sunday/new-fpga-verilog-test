name: lvs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lvs:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv python3-tk git make wget xvfb
          python3 -m pip install --upgrade pip

      - name: Install OpenLane and volare
        run: |
          python3 -m pip install openlane volare

      - name: Install PDK using volare
        run: |
          mkdir -p $HOME/.volare/pdks
          export PDK_ROOT=$HOME/.volare/pdks
          echo "PDK_ROOT=$PDK_ROOT" >> $GITHUB_ENV
          
          python3 -m volare enable \
            0fe599b2afb6708d281543108caf8310912f54af \
            --pdk-root $PDK_ROOT \
            --pdk sky130
          
          # Create symlink for sky130A if it doesn't exist
          if [ -d "$PDK_ROOT/volare/sky130/versions/0fe599b2afb6708d281543108caf8310912f54af/sky130A" ]; then
            ln -sf "$PDK_ROOT/volare/sky130/versions/0fe599b2afb6708d281543108caf8310912f54af/sky130A" "$PDK_ROOT/sky130A"
            echo " sky130A symlink created"
          fi
          
          echo "PDK installed at: $PDK_ROOT"
          ls -la $PDK_ROOT

      - name: Pull LibreLane image
        run: docker pull ghcr.io/librelane/librelane:3.0.10

      - name: Create proper config file
        run: |
          # Find all Verilog files, excluding test and sim files
          echo "Finding Verilog files..."
          
          # Get unique source files only (exclude test/sim files)
          VERILOG_FILES=$(find ./src -name "*.v" -type f | grep -v "_sim.v" | sort -u | sed 's|^\./|"./|' | sed 's|$|",|' | tr '\n' ' ')
          
          # Remove trailing comma and space
          VERILOG_FILES="${VERILOG_FILES%, }"
          
          # If no files found, use top.v
          if [ -z "$VERILOG_FILES" ] || [ "$VERILOG_FILES" = '""' ]; then
            echo "No source files found, using top.v"
            VERILOG_FILES='"./src/top.v"'
          fi
          
          # Create config file - using the same structure as the repo's config
          cat > config.json << EOF
          {
            "PDK": "sky130A",
            "DESIGN_NAME": "tt_um_silicon_dreams",
            "VERILOG_FILES": [
              $VERILOG_FILES
            ],
            "CLOCK_PORT": "clk",
            "CLOCK_PERIOD": 10,
            "CLOCK_NET": "clk",
            "STD_CELL_LIBRARY": "sky130_fd_sc_hd",
            "SYNTH_STRATEGY": "DELAY 4",
            "SYNTH_BUFFERING": 1,
            "SYNTH_SIZING": 1,
            "FP_SIZING": "absolute",
            "DIE_AREA": "0 0 161 225",
            "FP_CORE_UTIL": 45,
            "FP_PDN_VPITCH": 60,
            "FP_PDN_HPITCH": 30,
            "FP_TAP_DISTANCE": 14,
            "FP_IO_MODE": 1,
            "PL_TARGET_DENSITY_PCT": 55,
            "PL_RANDOM_INITIAL_PLACEMENT_SEED": 42,
            "DIODE_INSERTION_STRATEGY": 3,
            "GRT_REPAIR_ANTENNAS": 1,
            "ROUTING_OPT_ITERS": 32,
            "RSZ_HOLD_MAX_BUFFER_PERCENT": 30,
            "RUN_LINTER": 1,
            "RUN_MAGIC_DRC": 1,
            "RUN_KLAYOUT_DRC": 1,
            "RUN_LVS": 1,
            "RUN_CVC": 0,
            "RUN_ANTENNA_CHECK": 1,
            "MAGIC_DEF_LABELS": 0
          }
          EOF
          
          echo "Created config.json with Verilog files and design parameters:"
          cat config.json

      - name: Update run-librelane.sh script to use working image
        run: |
          # Backup original script
          if [ -f "scripts/run-librelane.sh" ]; then
            cp scripts/run-librelane.sh scripts/run-librelane.sh.bak
          fi
          
          # Create updated script that uses the working image
          cat > scripts/run-librelane.sh << 'EOF'
          #!/usr/bin/env bash
          # Silicon Dreams · Module 3 · LibreLane wrapper.
          set -euo pipefail

          PDK_ROOT="${PDK_ROOT:-$HOME/.volare/pdks}"
          TAG=""
          VERSION_CHECK_ONLY=0

          while [[ $# -gt 0 ]]; do
            case "$1" in
              --tag)            TAG="$2"; shift 2 ;;
              --version-check)  VERSION_CHECK_ONLY=1; shift ;;
              *) echo "Unknown arg: $1" >&2; exit 2 ;;
            esac
          done

          # Use config.json in root directory
          CONFIG_JSON="config.json"

          if [[ ! -f "$CONFIG_JSON" ]]; then
            echo "Error: config.json not found." >&2
            exit 1
          fi

          if [[ "$VERSION_CHECK_ONLY" -eq 1 ]]; then
            echo "OK: LibreLane ready."
            exit 0
          fi

          if [[ -z "$TAG" ]]; then
            TAG="ci-lvs"
          fi

          echo "==> LibreLane  ·  tag=$TAG"
          echo "==> PDK_ROOT: $PDK_ROOT"
          echo "==> Using config: $CONFIG_JSON"

          # Run LibreLane signoff with the correct image
          docker run --rm \
            -v $(pwd):/workspace \
            -v "$PDK_ROOT":/pdk \
            -e PDK_ROOT=/pdk \
            -w /workspace \
            ghcr.io/librelane/librelane:3.0.10 \
            python3 -m librelane \
              --pdk-root /pdk \
              --run-tag "$TAG" \
              --docker-no-tty \
              "$CONFIG_JSON"

          echo "==> Done. Reports under runs/$TAG/reports/"
          EOF
          
          chmod +x scripts/run-librelane.sh
          echo " scripts/run-librelane.sh updated"

      - name: Run LibreLane through LVS
        env:
          PDK_ROOT: /home/runner/.volare/pdks
        run: ./scripts/run-librelane.sh --tag ci-lvs

      - name: Check LVS result
        id: check
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    LVS RESULT CHECK                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          
          echo " Searching for LVS report..."
          
          # Try multiple possible LVS report locations
          LVS_REPORT=""
          LVS_PASSED=false
          LVS_DETAILS=""
          
          for report in \
            "runs/ci-lvs/70-netgen-lvs/reports/lvs.netgen.rpt" \
            "runs/ci-lvs/70-netgen-lvs/reports/lvs.rpt" \
            "runs/ci-lvs/reports/signoff/lvs.rpt" \
            "runs/ci-lvs/reports/lvs.rpt" \
            "runs/ci-lvs/lvs.rpt" \
            "runs/ci-lvs/results/final/lvs.rpt" \
            "runs/ci-lvs/logs/lvs/lvs.rpt" \
            "runs/ci-lvs/69-openroad-lvs/lvs.rpt" \
            $(find runs -name "*.lvs.rpt" -o -name "lvs.netgen.rpt" -o -name "lvs.rpt" 2>/dev/null); do
            if [ -f "$report" ]; then
              LVS_REPORT="$report"
              echo "📄 Found LVS report at: $LVS_REPORT"
              break
            fi
          done
          
          if [ -z "$LVS_REPORT" ]; then
            echo " No LVS report found."
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║                    LVS RESULT SUMMARY                       ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            echo "  ┌──────────────────────────────────────────────┐"
            echo "  │            LVS FAILED!                       │"
            echo "  └──────────────────────────────────────────────┘"
            echo ""
            echo "   Details: No LVS report found"
            echo ""
            echo "match=false" >> $GITHUB_OUTPUT
          else
            echo ""
            echo " LVS Report Content (first 50 lines):"
            echo "──────────────────────────────────────────────────"
            head -50 "$LVS_REPORT"
            echo "──────────────────────────────────────────────────"
            echo ""
            
            # Check the LVS report for pass/fail
            if grep -q "Circuits match: MATCH" "$LVS_REPORT"; then
              echo " Found 'Circuits match: MATCH'"
              LVS_PASSED=true
              LVS_DETAILS="Circuits match: MATCH"
            elif grep -q "Circuits match: MISMATCH" "$LVS_REPORT"; then
              echo " Found 'Circuits match: MISMATCH'"
              LVS_PASSED=false
              LVS_DETAILS="Circuits match: MISMATCH"
            elif grep -q "Netlists match" "$LVS_REPORT"; then
              echo " Found 'Netlists match'"
              LVS_PASSED=true
              LVS_DETAILS="Netlists match"
            elif grep -q "LVS result: passed" "$LVS_REPORT"; then
              echo " Found 'LVS result: passed'"
              LVS_PASSED=true
              LVS_DETAILS="LVS result: passed"
            elif grep -q "LVS result: failed" "$LVS_REPORT"; then
              echo " Found 'LVS result: failed'"
              LVS_PASSED=false
              LVS_DETAILS="LVS result: failed"
            elif grep -q "match" "$LVS_REPORT" && grep -q "true" "$LVS_REPORT"; then
              echo " Found 'match: true'"
              LVS_PASSED=true
              LVS_DETAILS="match: true"
            else
              echo " Could not determine LVS result from report."
              LVS_PASSED=false
              LVS_DETAILS="Unknown - check report manually"
            fi
            
            # Also check JSON report if available
            if [ -f "runs/ci-lvs/70-netgen-lvs/reports/lvs.netgen.json" ]; then
              echo ""
              echo " Checking JSON report..."
              if grep -q '"match": true' "runs/ci-lvs/70-netgen-lvs/reports/lvs.netgen.json"; then
                echo " JSON confirms match: true"
                LVS_PASSED=true
                LVS_DETAILS="JSON match: true"
              elif grep -q '"match": false' "runs/ci-lvs/70-netgen-lvs/reports/lvs.netgen.json"; then
                echo " JSON shows match: false"
                LVS_PASSED=false
                LVS_DETAILS="JSON match: false"
              fi
            fi
            
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║                    LVS RESULT SUMMARY                       ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            
            # Display the result with clear formatting
            if [ "$LVS_PASSED" = true ]; then
              echo "  ┌──────────────────────────────────────────────┐"
              echo "  │             LVS PASSED!                      │"
              echo "  └──────────────────────────────────────────────┘"
              echo ""
              echo "   Details: $LVS_DETAILS"
              echo ""
              echo "   LVS (Layout vs Schematic) verification passed."
              echo "     The physical layout matches the circuit schematic."
              echo ""
              echo "match=true" >> $GITHUB_OUTPUT
            else
              echo "  ┌──────────────────────────────────────────────┐"
              echo "  │             LVS FAILED!                      │"
              echo "  └──────────────────────────────────────────────┘"
              echo ""
              echo "   Details: $LVS_DETAILS"
              echo ""
              echo "   LVS (Layout vs Schematic) verification failed."
              echo "     The physical layout does NOT match the circuit schematic."
              echo ""
              echo "match=false" >> $GITHUB_OUTPUT
            fi
            
            # Show the last few lines of the report for context (usually where the result is)
            echo ""
            echo "   Last 5 lines of LVS report (usually contains result):"
            echo "  ──────────────────────────────────────────────────"
            tail -5 "$LVS_REPORT" | sed 's/^/  /'
            echo "  ──────────────────────────────────────────────────"
          fi

      - name: POST metrics to ChipFoundry grader
        if: always()
        env:
          CHIPFOUNDRY_TOKEN: ${{ secrets.CHIPFOUNDRY_TOKEN }}
        run: |
          if [ -n "$CHIPFOUNDRY_TOKEN" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $CHIPFOUNDRY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"workflow\":\"lvs\",\"tag\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\",\"match\":\"${{ steps.check.outputs.match }}\"}" \
              https://grader.chipfoundry.io/v1/silicon-dreams/m3 || true
          else
            echo "CHIPFOUNDRY_TOKEN not set, skipping metrics post"
          fi

      - name: Fail if final tag and LVS not matching
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-final')
        run: |
          if [[ "${{ steps.check.outputs.match }}" != "true" ]]; then
            echo " Final tag requires LVS match." >&2
            exit 1
          else
            echo " LVS passed for final tag!"
          fi

      - name: Upload LVS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lvs-reports
          path: |
            runs/**/*.rpt
            runs/**/*.log
            runs/**/*.json
            runs/**/lvs.netgen.rpt
          retention-days: 30
          if-no-files-found: warn

      - name: Debug - List directory structure
        if: always()
        run: |
          echo "=== Workspace contents ==="
          ls -la
          echo ""
          echo "=== Config file ==="
          cat config.json
          echo ""
          echo "=== All LVS-related files ==="
          find runs -name "*lvs*" -type f 2>/dev/null | sort
          echo ""
          echo "=== LVS report content ==="
          if [ -f "runs/ci-lvs/70-netgen-lvs/reports/lvs.netgen.rpt" ]; then
            cat runs/ci-lvs/70-netgen-lvs/reports/lvs.netgen.rpt
          else
            echo "LVS report not found"
          fi
