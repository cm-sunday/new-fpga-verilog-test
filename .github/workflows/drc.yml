name: drc

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  drc:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          docker --version
          docker pull efabless/librelane:2025.04

      - name: Install PDK
        run: |
          mkdir -p $HOME/.volare/pdks
          ./scripts/install-pdk.sh

      - name: Run LibreLane through DRC
        env:
          PDK_ROOT: /home/runner/.volare/pdks
        run: ./scripts/run-librelane.sh --tag ci-drc

      - name: Check DRC report
        id: check
        run: |
          RPT=runs/ci-drc/reports/signoff/drc.rpt
          if [[ ! -f "$RPT" ]]; then
            echo "DRC report missing" >&2
            exit 1
          fi
          ERRORS=$(grep -c "^\[DRC-" "$RPT" || true)
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          if [[ "$ERRORS" != "0" ]]; then
            echo "::warning::DRC has $ERRORS violations (not fatal during iteration)"
          fi

      - name: POST metrics to ChipFoundry grader
        if: always()
        env:
          CHIPFOUNDRY_TOKEN: ${{ secrets.CHIPFOUNDRY_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $CHIPFOUNDRY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"drc\",\"tag\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\",\"errors\":${{ steps.check.outputs.errors || 0 }}}" \
            https://grader.chipfoundry.io/v1/silicon-dreams/m3 || true

      - name: Fail if final tag and DRC not clean
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-final')
        run: |
          if [[ "${{ steps.check.outputs.errors }}" != "0" ]]; then
            echo "Final tag requires DRC==0; have ${{ steps.check.outputs.errors }}." >&2
            exit 1
          fi
