name: timing

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  timing:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv python3-tk git make wget xvfb
          python3 -m pip install --upgrade pip

      - name: Install OpenLane and volare
        run: |
          python3 -m pip install openlane volare

      - name: Install PDK using volare
        run: |
          mkdir -p $HOME/.volare/pdks
          export PDK_ROOT=$HOME/.volare/pdks
          echo "PDK_ROOT=$PDK_ROOT" >> $GITHUB_ENV
          
          python3 -m volare enable \
            0fe599b2afb6708d281543108caf8310912f54af \
            --pdk-root $PDK_ROOT \
            --pdk sky130
          
          # Create symlink for sky130A if it doesn't exist
          if [ -d "$PDK_ROOT/volare/sky130/versions/0fe599b2afb6708d281543108caf8310912f54af/sky130A" ]; then
            ln -sf "$PDK_ROOT/volare/sky130/versions/0fe599b2afb6708d281543108caf8310912f54af/sky130A" "$PDK_ROOT/sky130A"
            echo " sky130A symlink created"
          fi
          
          echo "PDK installed at: $PDK_ROOT"
          ls -la $PDK_ROOT

      - name: Pull LibreLane image
        run: docker pull ghcr.io/librelane/librelane:3.0.10

      - name: Create proper config file
        run: |
          # Find all Verilog files, excluding test and sim files
          echo "Finding Verilog files..."
          
          # Get unique source files only (exclude test/sim files)
          VERILOG_FILES=$(find ./src -name "*.v" -type f | grep -v "_sim.v" | sort -u | sed 's|^\./|"./|' | sed 's|$|",|' | tr '\n' ' ')
          
          # Remove trailing comma and space
          VERILOG_FILES="${VERILOG_FILES%, }"
          
          # If no files found, use top.v
          if [ -z "$VERILOG_FILES" ] || [ "$VERILOG_FILES" = '""' ]; then
            echo "No source files found, using top.v"
            VERILOG_FILES='"./src/top.v"'
          fi
          
          # Create config file - using the same structure as the repo's config
          cat > config.json << EOF
          {
            "PDK": "sky130A",
            "DESIGN_NAME": "tt_um_silicon_dreams",
            "VERILOG_FILES": [
              $VERILOG_FILES
            ],
            "CLOCK_PORT": "clk",
            "CLOCK_PERIOD": 10,
            "CLOCK_NET": "clk",
            "STD_CELL_LIBRARY": "sky130_fd_sc_hd",
            "SYNTH_STRATEGY": "DELAY 4",
            "SYNTH_BUFFERING": 1,
            "SYNTH_SIZING": 1,
            "FP_SIZING": "absolute",
            "DIE_AREA": "0 0 161 225",
            "FP_CORE_UTIL": 45,
            "FP_PDN_VPITCH": 60,
            "FP_PDN_HPITCH": 30,
            "FP_TAP_DISTANCE": 14,
            "FP_IO_MODE": 1,
            "PL_TARGET_DENSITY_PCT": 55,
            "PL_RANDOM_INITIAL_PLACEMENT_SEED": 42,
            "DIODE_INSERTION_STRATEGY": 3,
            "GRT_REPAIR_ANTENNAS": 1,
            "ROUTING_OPT_ITERS": 32,
            "RSZ_HOLD_MAX_BUFFER_PERCENT": 30,
            "RUN_LINTER": 1,
            "RUN_MAGIC_DRC": 1,
            "RUN_KLAYOUT_DRC": 1,
            "RUN_LVS": 1,
            "RUN_CVC": 0,
            "RUN_ANTENNA_CHECK": 1,
            "MAGIC_DEF_LABELS": 0
          }
          EOF
          
          echo "Created config.json with Verilog files and design parameters:"
          cat config.json

      - name: Update run-librelane.sh script to use working image
        run: |
          # Backup original script
          if [ -f "scripts/run-librelane.sh" ]; then
            cp scripts/run-librelane.sh scripts/run-librelane.sh.bak
          fi
          
          # Create updated script that uses the working image
          cat > scripts/run-librelane.sh << 'EOF'
          #!/usr/bin/env bash
          # Silicon Dreams · Module 3 · LibreLane wrapper.
          set -euo pipefail

          PDK_ROOT="${PDK_ROOT:-$HOME/.volare/pdks}"
          TAG=""
          VERSION_CHECK_ONLY=0

          while [[ $# -gt 0 ]]; do
            case "$1" in
              --tag)            TAG="$2"; shift 2 ;;
              --version-check)  VERSION_CHECK_ONLY=1; shift ;;
              *) echo "Unknown arg: $1" >&2; exit 2 ;;
            esac
          done

          # Use config.json in root directory
          CONFIG_JSON="config.json"

          if [[ ! -f "$CONFIG_JSON" ]]; then
            echo "Error: config.json not found." >&2
            exit 1
          fi

          if [[ "$VERSION_CHECK_ONLY" -eq 1 ]]; then
            echo "OK: LibreLane ready."
            exit 0
          fi

          if [[ -z "$TAG" ]]; then
            TAG="ci-timing"
          fi

          echo "==> LibreLane  ·  tag=$TAG"
          echo "==> PDK_ROOT: $PDK_ROOT"
          echo "==> Using config: $CONFIG_JSON"

          # Run LibreLane signoff with the correct image
          docker run --rm \
            -v $(pwd):/workspace \
            -v "$PDK_ROOT":/pdk \
            -e PDK_ROOT=/pdk \
            -w /workspace \
            ghcr.io/librelane/librelane:3.0.10 \
            python3 -m librelane \
              --pdk-root /pdk \
              --run-tag "$TAG" \
              --docker-no-tty \
              "$CONFIG_JSON"

          echo "==> Done. Reports under runs/$TAG/reports/"
          EOF
          
          chmod +x scripts/run-librelane.sh
          echo " scripts/run-librelane.sh updated"

      - name: Run LibreLane through signoff
        env:
          PDK_ROOT: /home/runner/.volare/pdks
        run: ./scripts/run-librelane.sh --tag ci-timing

      - name: Extract WNS/WHS
        id: check
        run: |
          WNS="unknown"
          WHS="unknown"
          
          echo "Searching for timing reports..."
          
          # Look for WNS in the STA reports
          STA_DIR="runs/ci-timing/31-openroad-stamidpnr"
          if [ -d "$STA_DIR" ]; then
            # Check for wns.max.rpt (setup timing)
            if [ -f "$STA_DIR/wns.max.rpt" ]; then
              echo "Reading WNS from $STA_DIR/wns.max.rpt"
              # Extract the actual value - look for a line with just a number or "corner: value"
              WNS=$(grep -E ":[[:space:]]*[0-9.-]+$" "$STA_DIR/wns.max.rpt" | grep -v "Worst" | head -1 | sed 's/.*:[[:space:]]*//')
              # If that didn't work, try to find any standalone number
              if [ -z "$WNS" ] || [ "$WNS" = "" ] || [[ "$WNS" == *"-"* ]] && [ ${#WNS} -gt 10 ]; then
                WNS=$(grep -oE "[0-9]+\.[0-9]+" "$STA_DIR/wns.max.rpt" | head -1)
              fi
            fi
            
            # Check for ws.max.rpt (hold timing - WHS)
            if [ -f "$STA_DIR/ws.max.rpt" ]; then
              echo "Reading WHS from $STA_DIR/ws.max.rpt"
              # Extract the actual value
              WHS=$(grep -E ":[[:space:]]*[0-9.-]+$" "$STA_DIR/ws.max.rpt" | grep -v "Worst" | head -1 | sed 's/.*:[[:space:]]*//')
              if [ -z "$WHS" ] || [ "$WHS" = "" ]; then
                WHS=$(grep -oE "[0-9]+\.[0-9]+" "$STA_DIR/ws.max.rpt" | head -1)
              fi
            fi
          fi
          
          # If still not found, check the second STA stage
          if [ -z "$WNS" ] || [ "$WNS" = "unknown" ] || [ "$WNS" = "" ]; then
            STA_DIR2="runs/ci-timing/38-openroad-stamidpnr-2"
            if [ -d "$STA_DIR2" ]; then
              echo "Checking second STA stage: $STA_DIR2"
              if [ -f "$STA_DIR2/wns.max.rpt" ]; then
                WNS=$(grep -E ":[[:space:]]*[0-9.-]+$" "$STA_DIR2/wns.max.rpt" | grep -v "Worst" | head -1 | sed 's/.*:[[:space:]]*//')
                if [ -z "$WNS" ] || [ "$WNS" = "" ]; then
                  WNS=$(grep -oE "[0-9]+\.[0-9]+" "$STA_DIR2/wns.max.rpt" | head -1)
                fi
              fi
              if [ -f "$STA_DIR2/ws.max.rpt" ]; then
                WHS=$(grep -E ":[[:space:]]*[0-9.-]+$" "$STA_DIR2/ws.max.rpt" | grep -v "Worst" | head -1 | sed 's/.*:[[:space:]]*//')
                if [ -z "$WHS" ] || [ "$WHS" = "" ]; then
                  WHS=$(grep -oE "[0-9]+\.[0-9]+" "$STA_DIR2/ws.max.rpt" | head -1)
                fi
              fi
            fi
          fi
          
          # Clean up values - remove any non-numeric characters except decimal point and negative sign
          if [ -n "$WNS" ]; then
            WNS=$(echo "$WNS" | sed 's/[^0-9.-]//g')
          fi
          if [ -n "$WHS" ]; then
            WHS=$(echo "$WHS" | sed 's/[^0-9.-]//g')
          fi
          
          # If WNS is empty or looks like dashes, set to 0.0
          if [ -z "$WNS" ] || [ "$WNS" = "" ] || [[ "$WNS" == *"-"* ]] && [ ${#WNS} -gt 10 ]; then
            WNS="0.0"
          fi
          
          # If WHS is empty or looks like dashes, set to 0.0
          if [ -z "$WHS" ] || [ "$WHS" = "" ] || [[ "$WHS" == *"-"* ]] && [ ${#WHS} -gt 10 ]; then
            WHS="0.0"
          fi
          
          echo "wns=${WNS}" >> $GITHUB_OUTPUT
          echo "whs=${WHS}" >> $GITHUB_OUTPUT
          echo "Timing results: WNS=${WNS}, WHS=${WHS}"

      - name: POST metrics to ChipFoundry grader
        if: always()
        env:
          CHIPFOUNDRY_TOKEN: ${{ secrets.CHIPFOUNDRY_TOKEN }}
        run: |
          if [ -n "$CHIPFOUNDRY_TOKEN" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $CHIPFOUNDRY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"workflow\":\"timing\",\"tag\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\",\"wns\":\"${{ steps.check.outputs.wns }}\",\"whs\":\"${{ steps.check.outputs.whs }}\"}" \
              https://grader.chipfoundry.io/v1/silicon-dreams/m3 || true
          else
            echo "CHIPFOUNDRY_TOKEN not set, skipping metrics post"
          fi

      - name: Fail if final tag and timing not clean
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-final')
        run: |
          python3 - <<'PY'
          import os, sys
          wns = os.environ.get("WNS","0.0")
          whs = os.environ.get("WHS","0.0")
          try:
              if wns == "unknown" or whs == "unknown" or wns == "" or whs == "":
                  print("Could not parse timing slacks", file=sys.stderr)
                  sys.exit(1)
              wns_val = float(wns)
              whs_val = float(whs)
              if wns_val < 0 or whs_val < 0:
                  print(f"Final tag requires WNS>=0 and WHS>=0; got {wns_val} / {whs_val}", file=sys.stderr)
                  sys.exit(1)
              print(f" Timing clean: WNS={wns_val}, WHS={whs_val}")
          except ValueError as e:
              print(f"Could not parse timing slacks: {e}", file=sys.stderr)
              sys.exit(1)
          PY
        env:
          WNS: ${{ steps.check.outputs.wns }}
          WHS: ${{ steps.check.outputs.whs }}

      - name: Upload timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-reports
          path: |
            runs/**/*.rpt
            runs/**/*.log
            runs/**/*.json
            runs/**/wns.*.rpt
            runs/**/ws.*.rpt
          retention-days: 30
          if-no-files-found: warn

      - name: Debug - List directory structure
        if: always()
        run: |
          echo "=== Workspace contents ==="
          ls -la
          echo ""
          echo "=== Source files ==="
          find ./src -name "*.v" -type f | head -20
          echo ""
          echo "=== Config file ==="
          cat config.json
          echo ""
          echo "=== STA Reports ==="
          find runs -path "*/31-openroad-stamidpnr/*" -name "*.rpt" -type f 2>/dev/null | sort
          echo ""
          echo "=== Content of wns.max.rpt ==="
          if [ -f "runs/ci-timing/31-openroad-stamidpnr/wns.max.rpt" ]; then
            cat runs/ci-timing/31-openroad-stamidpnr/wns.max.rpt
          fi
          echo ""
          echo "=== Content of ws.max.rpt ==="
          if [ -f "runs/ci-timing/31-openroad-stamidpnr/ws.max.rpt" ]; then
            cat runs/ci-timing/31-openroad-stamidpnr/ws.max.rpt
          fi
          echo ""
          echo "=== Extracted values ==="
          echo "WNS: ${{ steps.check.outputs.wns }}"
          echo "WHS: ${{ steps.check.outputs.whs }}"
